<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetControl | Topología de Red</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Vis.js Network CDN para grafos profesionales -->
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  
  <style>
    .glass-nav {
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    #network-container {
      background: radial-gradient(circle at center, #090d16 0%, #020617 100%);
      width: 100%;
      height: calc(100vh - 73px);
      position: absolute;
      top: 73px;
      left: 0;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased overflow-hidden flex flex-col">

  <!-- ==================== HEADER ==================== -->
  <header class="glass-nav sticky top-0 z-50 px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4 shadow-xl">
    <div class="flex items-center gap-3">
      <a href="gest_direcciones.html" class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-slate-900 text-slate-300 hover:text-white border border-slate-700 transition shadow-inner" title="Volver al Visor 3D">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </a>
      <div class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/30 shadow-inner">
        <i class="fa-solid fa-network-wired text-base"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white leading-tight">NetControl <span class="text-xs font-normal text-blue-400 font-mono">Topología de Infraestructura</span></h1>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="loadNetworkTopology()" class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white transition text-xs font-mono font-bold border border-slate-700 flex items-center gap-2">
        <i class="fa-solid fa-rotate text-blue-400"></i> Actualizar Grafo
      </button>
    </div>
  </header>

  <!-- ==================== LIENZO DE TOPOLOGÍA (PANTALLA COMPLETA) ==================== -->
  <main class="relative w-full flex-1">
    <div id="network-container"></div>

    <!-- Leyenda flotante superior derecha (estilo visor 3D) -->
    <div id="topology-legend-box" class="absolute top-4 right-4 z-30 bg-slate-900/90 backdrop-blur-md p-3.5 rounded-xl border border-slate-700/80 shadow-2xl text-xs font-mono text-slate-200 max-w-xs pointer-events-auto">
      <p class="font-bold text-blue-400 mb-2 pb-1.5 border-b border-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-layer-group"></i> Leyenda de Enlaces
      </p>
      <div class="space-y-1.5 text-slate-300">
        <div class="flex items-center gap-2"><span class="w-3 h-1 bg-amber-500 inline-block rounded"></span> Troncal 10GbE</div>
        <div class="flex items-center gap-2"><span class="w-3 h-1 bg-teal-400 inline-block rounded"></span> Enlace 2.5GbE / Giga</div>
        <div class="flex items-center gap-2"><span class="w-3 h-1 bg-indigo-500 inline-block rounded"></span> Conexión AP / Redes WiFi</div>
      </div>
    </div>
  </main>

  <!-- Script principal de topología -->
  <script type="module" src="../assets/js/topologia_red.js"></script>
</body>
</html>
