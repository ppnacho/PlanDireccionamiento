<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetControl | Topología de Red</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Vis.js Network CDN para grafos profesionales -->
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  
  <style>
    .glass-nav {
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    #network-container {
      background: radial-gradient(circle at center, #090d16 0%, #020617 100%);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased flex flex-col">

  <!-- ==================== HEADER ==================== -->
  <header class="glass-nav sticky top-0 z-50 px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4 shadow-xl">
    <div class="flex items-center gap-3">
      <!-- Botón de vuelta al panel o visor 3D -->
      <a href="representacion_3d.html" class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-slate-900 text-slate-300 hover:text-white border border-slate-700 transition shadow-inner" title="Volver al Visor">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </a>
      <div class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/30 shadow-inner">
        <i class="fa-solid fa-network-wired text-base"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white leading-tight">NetControl <span class="text-xs font-normal text-blue-400 font-mono">Topología de Infraestructura</span></h1>
        <p class="text-xs text-slate-400 font-mono">Esquema jerárquico de red (Planta Baja, Primera, Buhardilla, Garaje)</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="loadNetworkTopology()" class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white transition text-xs font-mono font-bold border border-slate-700 flex items-center gap-2">
        <i class="fa-solid fa-rotate text-blue-400"></i> Actualizar Grafo
      </button>
    </div>
  </header>

  <!-- ==================== LIENZO DE TOPOLOGÍA ==================== -->
  <main class="flex-1 w-full relative flex flex-col">
    <div id="network-container" class="flex-1 w-full h-[calc(100vh-70px)]"></div>

    <!-- Leyenda flotante inferior -->
    <div class="absolute bottom-4 left-4 bg-slate-900/80 backdrop-blur-md border border-slate-800 p-3 rounded-xl shadow-2xl font-mono text-[11px] space-y-1.5 pointer-events-none hidden sm:block">
      <div class="text-white font-bold mb-1 flex items-center gap-1.5"><i class="fa-solid fa-circle-info text-blue-400"></i> Leyenda de Enlaces</div>
      <div class="flex items-center gap-2 text-slate-300"><span class="w-3 h-0.5 bg-indigo-500 inline-block"></span> Troncal / 10GbE / 2.5GbE</div>
      <div class="flex items-center gap-2 text-slate-300"><span class="w-3 h-0.5 bg-emerald-500 inline-block"></span> Conexión Cliente / AP / Switch</div>
    </div>
  </main>

  <!-- Script principal de topología -->
  <script type="module" src="../assets/js/topologia_red.js"></script>
</body>
</html>
