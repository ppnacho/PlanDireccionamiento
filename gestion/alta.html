<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetControl | Alta de Dispositivo</title>
  
  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .bg-network {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.75) 0%, rgba(15, 23, 42, 0.90) 100%),
                  url('../assets/img/background_index.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .glass-nav {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* Ocultar flechas en inputs tipo número para los puertos */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen bg-network antialiased flex flex-col">

  <!-- ==================== HEADER / NAVEGACIÓN SUPERIOR ==================== -->
  <header class="glass-nav sticky top-0 z-50 px-4 sm:px-8 py-3.5 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-3">
      <a href="gest_direcciones.html" class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/30 hover:bg-blue-600/30 transition shadow-inner">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </a>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-white leading-tight">NetControl</h1>
        <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Alta de Dispositivo</span>
      </div>
    </div>
    <span class="hidden md:inline-block text-xs text-slate-300 font-mono bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
      <i class="fa-solid fa-user-shield text-blue-400 mr-1.5"></i> <span class="user-email-text">admin@redlocal.lan</span>
    </span>
  </header>

  <!-- ==================== CONTENIDO PRINCIPAL (ANCHO COMPLETO) ==================== -->
  <main class="flex-1 w-full px-4 sm:px-6 lg:px-8 py-6">
    <div class="glass-card rounded-2xl p-6 sm:p-8 shadow-xl max-w-full mx-auto">
      <h2 class="text-xl font-bold text-white tracking-tight mb-6 pb-3 border-b border-slate-700/80 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-blue-400"></i> Nuevo Registro en Inventario
      </h2>

      <form id="form-alta" class="space-y-5 text-sm">

        <!-- BLOQUE 1: Ubicación -->
        <div>
          <h3 class="text-xs font-semibold uppercase tracking-wider text-blue-400 mb-3"><i class="fa-solid fa-location-dot mr-1.5"></i> Ubicación</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block font-medium text-slate-300 mb-1.5">Planta *</label>
              <select id="planta" required class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                <option value="">Selecciona planta...</option>
                <option value="BAJA">BAJA</option>
                <option value="PRIMERA">PRIMERA</option>
                <option value="BUHARDILLA">BUHARDILLA</option>
                <option value="ESCALERAS">ESCALERAS</option>
              </select>
            </div>

            <div>
              <label class="block font-medium text-slate-300 mb-1.5">Estancia *</label>
              <select id="estancia" required class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                <option value="">Selecciona estancia...</option>
                <option value="Cocina">Cocina</option>
                <option value="Aseo">Aseo</option>
                <option value="Salon">Salon</option>
                <option value="Hall">Hall</option>
                <option value="Jardin">Jardin</option>
                <option value="Entrada">Entrada</option>
                <option value="Garaje">Garaje</option>
                <option value="Tendedero">Tendedero</option>
                <option value="HabPpal">HabPpal</option>
                <option value="BañoPpal">BañoPpal</option>
                <option value="HabDoble">HabDoble</option>
                <option value="Baño">Baño</option>
                <option value="HabIndividual">HabIndividual</option>
                <option value="Buhardilla">Buhardilla</option>
              </select>
            </div>
          </div>
        </div>

        <!-- BLOQUE 2: Conexión y Hardware -->
        <div class="pt-2">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-blue-400 mb-3"><i class="fa-solid fa-microchip mr-1.5"></i> Hardware & Red</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div>
              <label class="block font-medium text-slate-300 mb-1.5">Tipo de Conexión *</label>
              <select id="tipo_conexion" required class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                <option value="ETH">ETH (Ethernet)</option>
                <option value="WIFI">WIFI</option>
              </select>
            </div>

            <div id="contenedor-ssid" class="hidden">
              <label class="block font-medium text-slate-300 mb-1.5">SSID (Red WiFi)</label>
              <input type="text" id="ssid" placeholder="Ej: MiRedWiFi" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 placeholder-slate-500">
            </div>

            <div>
              <label class="block font-medium text-slate-300 mb-1.5">ID Hardware *</label>
              <input type="text" id="id_hw" required placeholder="Ej: ESP32-Relay-01" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 placeholder-slate-500">
            </div>

            <div>
              <label class="block font-medium text-slate-300 mb-1.5">Dirección MAC *</label>
              <input type="text" id="mac" required placeholder="Ej: AA:BB:CC:DD:EE:FF" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 placeholder-slate-500">
            </div>
          </div>
        </div>

        <!-- BLOQUE 3: Configuración IP -->
        <div class="pt-2">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-blue-400 mb-3"><i class="fa-solid fa-network-wired mr-1.5"></i> Protocolo IP & Docker</h3>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block font-medium text-slate-300 mb-1.5">Tipo de IP *</label>
              <select id="tipo_ip" required class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                <option value="DHCP">DHCP (Dinámica)</option>
                <option value="estatica">Estática</option>
                <option value="DHCP estatica">DHCP Estática (Reserva)</option>
              </select>
            </div>

            <div id="contenedor-ip" class="hidden">
              <label class="block font-medium text-slate-300 mb-1.5">Dirección IP *</label>
              <input type="text" id="ip" placeholder="Ej: 192.168.1.50" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 placeholder-slate-500">
            </div>

            <div>
              <label class="block font-medium text-slate-300 mb-1.5">Red Docker (Dock Network)</label>
              <input type="text" id="dock_network" placeholder="Ej: bridge / macvlan" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 placeholder-slate-500">
            </div>
          </div>
        </div>

        <!-- BLOQUE 4: Puertos -->
        <div class="pt-2">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-blue-400 mb-3"><i class="fa-solid fa-ethernet mr-1.5"></i> Mapeo de Puertos</h3>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Puerto Rout. Ext</label>
              <input type="number" id="puerto_rout_ext" placeholder="Ej: 8080" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 placeholder-slate-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Puerto Rout. Int</label>
              <input type="number" id="puerto_rout_int" placeholder="Ej: 80" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 placeholder-slate-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Puerto Dock. Int</label>
              <input type="number" id="puerto_dock_int" placeholder="Ej: 3000" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 placeholder-slate-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Puerto Dock. Ext</label>
              <input type="number" id="puerto_dock_ext" placeholder="Ej: 3000" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 placeholder-slate-500">
            </div>
          </div>
        </div>

        <!-- BLOQUE 5: Servicios, Software y Comentarios -->
        <div class="pt-2">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-blue-400 mb-3"><i class="fa-solid fa-server mr-1.5"></i> Servicios, Software & Notas</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div>
              <label class="block font-medium text-slate-300 mb-1.5">Servicios (comas)</label>
              <input type="text" id="servicio" placeholder="Ej: Home Assistant, MQTT" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 placeholder-slate-500">
            </div>
            <div>
              <label class="block font-medium text-slate-300 mb-1.5">Tipo Servicios (comas)</label>
              <input type="text" id="tipo_servicio" placeholder="Ej: Domótica, Broker" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 placeholder-slate-500">
            </div>
            <div>
              <label class="block font-medium text-slate-300 mb-1.5">Software (comas)</label>
              <input type="text" id="software" placeholder="Ej: ESPHome, Tasmota" class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 placeholder-slate-500">
            </div>
          </div>
          <div class="mt-4">
            <label class="block font-medium text-slate-300 mb-1.5">Comentarios</label>
            <input type="text" id="comentarios" placeholder="Notas o ubicación específica..." class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 placeholder-slate-500">
          </div>
        </div>

        <!-- Botones de Acción -->
        <div class="flex justify-end gap-4 pt-4 border-t border-slate-700/80">
          <a href="gest_direcciones.html" class="px-5 py-2.5 rounded-lg border border-slate-600 text-slate-300 hover:bg-slate-700 transition font-medium">Cancelar</a>
          <button type="submit" id="btn-guardar" class="px-6 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium transition flex items-center gap-2 shadow-md shadow-blue-600/20">
            <i class="fa-solid fa-floppy-disk"></i> Guardar Dispositivo
          </button>
        </div>

      </form>
    </div>
  </main>

  <!-- Script principal del formulario -->
  <script type="module" src="../assets/js/alta.js"></script>
</body>
</html>
