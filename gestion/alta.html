<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetControl - Alta de Dispositivo y Servicios</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-mono min-h-screen pb-12">

  <!-- Navbar superior -->
  <nav class="bg-slate-900/85 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <a href="gest_direcciones.html" class="text-blue-400 hover:text-blue-300 transition text-sm flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Volver
      </a>
      <span class="text-slate-600">|</span>
      <h1 class="font-bold text-slate-200 tracking-wider">NETCONTROL <span class="text-blue-500 text-xs">ALTA MULTI-SERVICIO</span></h1>
    </div>
    <div class="text-xs text-slate-400 user-email-text"></div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 mt-8">
    <form id="form-alta" class="space-y-8">

      <!-- TARJETA 1: DATOS FÍSICOS Y DE HARDWARE -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-1.5 h-full bg-blue-500"></div>
        <div class="flex items-center justify-between mb-6 pb-3 border-b border-slate-800">
          <h2 class="text-base font-bold text-blue-400 flex items-center gap-2">
            <i class="fa-solid fa-server"></i> 1. Información de Hardware y Ubicación
          </h2>
          <span class="text-[10px] bg-blue-950 text-blue-300 px-2.5 py-1 rounded-md border border-blue-900/50">Tabla: dispositivos_red</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Planta *</label>
            <select id="planta" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 focus:outline-none focus:border-blue-500">
              <option value="">Selecciona planta...</option>
              <option value="BAJA">BAJA</option>
              <option value="ESCALERA 1">ESCALERA 1</option>
              <option value="PRIMERA">PRIMERA</option>
              <option value="ESCALERA 2">ESCALERA 2</option>
              <option value="BUHARDILLA">BUHARDILLA</option>
            </select>
          </div>

          <div>
            <label class="block text-slate-400 mb-1">Estancia *</label>
            <select id="estancia" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 focus:outline-none focus:border-blue-500">
              <option value="">Selecciona estancia...</option>
              <option value="Cocina">Cocina</option>
              <option value="Aseo">Aseo</option>
              <option value="Salon">Salon</option>
              <option value="Hall">Hall</option>
              <option value="Jardin">Jardin</option>
              <option value="Entrada">Entrada</option>
              <option value="Garaje">Garaje</option>
              <option value="Tendedero">Tendedero</option>
              <option value="HabPpal">HabPpal</option>
              <option value="BañoPpal">BañoPpal</option>
              <option value="HabDoble">HabDoble</option>
              <option value="Baño">Baño</option>
              <option value="HabIndividual">HabIndividual</option>
              <option value="Buhardilla">Buhardilla</option>
            </select>
          </div>

          <div>
            <label class="block text-slate-400 mb-1">Hostname (Único) *</label>
            <input type="text" id="hostname" required placeholder="Ej. watchdog-sala" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 focus:outline-none focus:border-blue-500">
          </div>

          <div>
            <label class="block text-slate-400 mb-1">ID Hardware / Modelo</label>
            <input type="text" id="id_hw" placeholder="Ej. ESP8266" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 focus:outline-none focus:border-blue-500">
          </div>

          <div>
            <label class="block text-slate-400 mb-1">MAC Address (Única) *</label>
            <input type="text" id="mac" required placeholder="AA:BB:CC:DD:EE:FF" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 uppercase focus:outline-none focus:border-blue-500">
          </div>

          <div>
            <label class="block text-slate-400 mb-1">Software Base (Hardware)</label>
            <input type="text" id="software_base" placeholder="Ej. Tasmota / Debian" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 focus:outline-none focus:border-blue-500">
          </div>

          <div class="md:col-span-3">
            <label class="block text-slate-400 mb-1">Comentarios</label>
            <textarea id="comentarios" rows="2" placeholder="Notas adicionales sobre el equipo físico..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 focus:outline-none focus:border-blue-500"></textarea>
          </div>
        </div>
      </div>

      <!-- SECCIÓN 2: SERVICIOS ASOCIADOS (DINÁMICA) -->
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-indigo-400 flex items-center gap-2">
            <i class="fa-solid fa-network-wired"></i> 2. Servicios de Red y Software Asociados
          </h2>
          <button type="button" id="btn-add-service" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-lg shadow-indigo-600/20">
            <i class="fa-solid fa-plus"></i> Añadir Servicio
          </button>
        </div>

        <div id="servicios-container" class="space-y-4">
          <!-- Las cards se inyectarán aquí -->
        </div>
      </div>

      <!-- BOTÓN GLOBAL DE GUARDADO -->
      <div class="pt-4 flex justify-end gap-3">
        <a href="representacion_3d.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-6 py-3 rounded-xl text-xs font-bold transition flex items-center">
          Cancelar
        </a>
        <button type="submit" id="btn-submit" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-xl shadow-blue-600/30">
          <i class="fa-solid fa-floppy-disk"></i> Guardar
        </button>
      </div>

    </form>
  </main>

  <!-- PLANTILLA HTML PARA LAS CARDS DE SERVICIO (SEPARACIÓN DE RESPONSABILIDADES) -->
  <template id="service-card-template">
    <div class="service-card bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden transition-all">
      <div class="absolute top-0 left-0 w-1.5 h-full bg-indigo-500"></div>
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
        <span class="service-title text-xs font-bold text-indigo-300 flex items-center gap-2">
          <i class="fa-solid fa-cubes"></i> Servicio #1
        </span>
        <button type="button" class="btn-remove-service text-red-400 hover:text-red-300 text-xs flex items-center gap-1 transition">
          <i class="fa-solid fa-trash"></i> Eliminar
        </button>
      </div>

      <div class="space-y-4 text-xs">
        <!-- FILA 1 -->
        <div class="grid grid-cols-1 md:grid-cols-6 gap-3 items-end">
          <div>
            <label class="block text-slate-400 mb-1">Servicio *</label>
            <input type="text" name="servicio" required placeholder="Ej. Home Assistant" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Tipo Conexión</label>
            <select name="tipo_conexion" class="tipo-conexion-select w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="">Selecciona...</option>
              <option value="ETHERNET">ETHERNET</option>
              <option value="WIFI">WIFI</option>
            </select>
          </div>
          <div class="ssid-container hidden">
            <label class="block text-slate-400 mb-1">SSID (Red Wifi)</label>
            <input type="text" name="ssid" placeholder="Ej. HomeIoT" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Tipo IP</label>
            <select name="tipo_ip" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="">Selecciona...</option>
              <option value="dinamica">DHCP</option>
              <option value="estatica">Estática</option>
              <option value="DHCP estatica">DHCP Estática</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Dirección IP</label>
            <input type="text" name="ip" placeholder="1.1.1.X" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Protocolo</label>
            <input type="text" name="protocolo" placeholder="Ej. TCP, HTTP" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <!-- FILA 2 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <div>
            <label class="block text-slate-400 mb-1">Software</label>
            <input type="text" name="software" placeholder="Ej. Docker" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Puerto Rout Ext ➔ Int</label>
            <div class="flex gap-1">
              <input type="text" name="puerto_rout_ext" placeholder="Ext" class="w-1/2 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
              <input type="text" name="puerto_rout_int" placeholder="Int" class="w-1/2 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Puerto Dock Ext ➔ Int</label>
            <div class="flex gap-1">
              <input type="text" name="puerto_dock_ext" placeholder="Ext" class="w-1/2 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
              <input type="text" name="puerto_dock_int" placeholder="Int" class="w-1/2 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Docker Network</label>
            <input type="text" name="dock_network" placeholder="Ej. bridge, host" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <!-- FILA 3 -->
        <div>
          <label class="block text-slate-400 mb-1">Comentarios</label>
          <textarea name="comentarios" rows="2" placeholder="Notas específicas sobre este servicio..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
        </div>
      </div>
    </div>
  </template>

  <!-- Script principal -->
  <script type="module" src="../assets/js/alta.js"></script>
</body>
</html>
