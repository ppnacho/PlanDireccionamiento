<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetControl | Gestión Documental</title>
  
  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .glass-nav {
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased flex flex-col">

  <!-- ==================== HEADER ==================== -->
  <header class="glass-nav sticky top-0 z-50 px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4 shadow-xl">
    <div class="flex items-center gap-3">
      <a href="representacion_3d.html" class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-slate-900 text-slate-300 hover:text-white border border-slate-700 transition shadow-inner" title="Volver al Visor 3D">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </a>
      <div class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 shadow-inner">
        <i class="fa-solid fa-folder-open text-base"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white leading-tight">NetControl <span class="text-xs font-normal text-indigo-400 font-mono">Gestión Documental</span></h1>
        <p id="subtitle-device" class="text-xs text-slate-400 font-mono">Cargando dispositivo...</p>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      <span class="hidden md:inline-block text-xs text-slate-300 font-mono bg-slate-900/90 px-3 py-1.5 rounded-lg border border-slate-800">
        <i class="fa-solid fa-user-shield text-blue-400 mr-1.5"></i> <span class="user-email-text">admin@redlocal.lan</span>
      </span>
    </div>
  </header>

  <!-- ==================== CONTENIDO PRINCIPAL ==================== -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">

    <!-- Tarjeta de Subida de Ficheros -->
    <div class="bg-slate-900/60 backdrop-blur-md rounded-2xl p-5 border border-slate-800 shadow-xl space-y-4">
      <h2 class="text-sm font-bold text-white font-mono flex items-center gap-2 border-b border-slate-800 pb-3">
        <i class="fa-solid fa-cloud-arrow-up text-indigo-400"></i> Subir Documentación al Almacenamiento
      </h2>

      <form id="form-upload" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <!-- Carpeta virtual opcional -->
        <div>
          <label class="block text-xs font-mono text-slate-400 mb-1.5">Carpeta / Categoría (Opcional)</label>
          <input type="text" id="folder-path" placeholder="ej: manuales, esquemas, configs" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs font-mono text-white focus:outline-none focus:border-indigo-500 transition">
        </div>

        <!-- Selección de archivo -->
        <div>
          <label class="block text-xs font-mono text-slate-400 mb-1.5">Seleccionar Archivo</label>
          <input type="file" id="file-input" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs font-mono text-slate-300 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-mono file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
        </div>

        <!-- Botón submit -->
        <div>
          <button type="submit" id="btn-upload" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-mono text-xs font-bold py-2.5 px-4 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
            <i class="fa-solid fa-upload"></i> Subir Archivo
          </button>
        </div>
      </form>
    </div>

    <!-- Explorador de Archivos (Árbol / Listado) -->
    <div class="bg-slate-900/60 backdrop-blur-md rounded-2xl p-5 border border-slate-800 shadow-xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-sm font-bold text-white font-mono flex items-center gap-2">
          <i class="fa-solid fa-folder-tree text-indigo-400"></i> Repositorio del Dispositivo <span id="badge-bucket" class="text-xs bg-slate-800 text-indigo-300 px-2.5 py-0.5 rounded-full border border-slate-700 font-normal">bucket: --</span>
        </h2>
        <button onclick="loadBucketFiles()" class="text-slate-400 hover:text-white text-xs font-mono flex items-center gap-1.5 transition">
          <i class="fa-solid fa-rotate"></i> Actualizar
        </button>
      </div>

      <!-- Contenedor del listado en árbol -->
      <div id="file-explorer" class="space-y-2 font-mono text-xs">
        <div class="text-center py-8 text-slate-500 italic">Cargando contenido del repositorio...</div>
      </div>
    </div>

  </main>

  <!-- Script principal de gestión documental -->
  <script type="module" src="../assets/js/load_documentos.js"></script>
</body>
</html>
