<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetControl | Data Center 3D Room</title>
  
  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .bg-datacenter {
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.85) 0%, rgba(2, 6, 23, 0.98) 100%),
                  url('../assets/img/background_index.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-nav {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    /* Estética de Rack de Servidor Realista */
    .server-rack {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.92) 0%, rgba(30, 41, 59, 0.85) 100%);
      border: 2px solid rgba(51, 65, 85, 0.8);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6), 0 10px 25px -5px rgba(0, 0, 0, 0.7);
      position: relative;
    }
    .server-rack::before, .server-rack::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background: #475569;
      border-radius: 50%;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
    }
    .server-rack::before { top: 8px; left: 8px; }
    .server-rack::after { top: 8px; right: 8px; }

    /* Estilo Blade de Servidor */
    .server-blade {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(71, 85, 105, 0.5);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .server-blade:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(59, 130, 246, 0.8);
      transform: scale(1.01);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.25);
    }
    /* LEDs indicadores */
    .led-green { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .led-blue { background-color: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
    .led-amber { background-color: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen bg-datacenter antialiased flex flex-col">

  <!-- ==================== HEADER ==================== -->
  <header class="glass-nav sticky top-0 z-50 px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4 shadow-lg">
    <div class="flex items-center gap-3">
      <!-- Botón de retorno al Hub gest_direcciones -->
      <a href="gest_direcciones.html" class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-slate-800 text-slate-300 hover:text-white border border-slate-700 transition" title="Volver al Hub">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </a>
      <div class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/30 shadow-inner">
        <i class="fa-solid fa-server text-base"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white leading-tight">NetControl <span class="text-xs font-normal text-slate-400">Data Center 3D Room</span></h1>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      <span class="hidden md:inline-block text-xs text-slate-300 font-mono bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
        <i class="fa-solid fa-user-shield text-blue-400 mr-1.5"></i> <span class="user-email-text">admin@redlocal.lan</span>
      </span>

      <!-- Botón Alta -->
      <a href="alta.html" class="inline-flex items-center gap-2 py-2 px-3 sm:px-4 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg shadow-md shadow-blue-600/20 transition text-xs sm:text-sm active:scale-95">
        <i class="fa-solid fa-plus"></i>
        <span>Alta Dispositivo</span>
      </a>

      <!-- Botón Logout -->
      <button onclick="handleLogout()" class="inline-flex items-center gap-2 py-2 px-3 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 font-medium rounded-lg transition text-xs sm:text-sm" title="Salir">
        <i class="fa-solid fa-power-off"></i>
      </button>
    </div>
  </header>

  <!-- ==================== CONTENIDO PRINCIPAL (SALA DE RACKS 5 FILAS) ==================== -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

    <!-- Barra de Búsqueda y Estado -->
    <div class="glass-nav p-4 rounded-xl shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4 border border-slate-800">
      <div>
        <h2 class="text-sm font-bold text-white tracking-tight flex items-center gap-2">
          <i class="fa-solid fa-cubes text-blue-400"></i> Topología de Sala: 5 Zonas de Rack Activas
        </h2>
        <p class="text-[11px] text-slate-400 mt-0.5">Baja, Escalera 1, Primera, Escalera 2 y Buhardilla.</p>
      </div>
      <div class="w-full sm:w-72 relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
          <i class="fa-solid fa-search text-xs"></i>
        </span>
        <input type="text" id="search-device" placeholder="Buscar por hostname, IP, MAC..." 
          class="w-full pl-9 pr-4 py-1.5 bg-slate-900/90 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 text-xs font-mono">
      </div>
    </div>

    <!-- Contenedor de las 5 Filas de Racks (Generado por JS) -->
    <div id="racks-container" class="space-y-6">
      <div class="text-center py-16 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-blue-400"></i>
        <p class="text-xs font-mono">Conectando con el inventario de Supabase...</p>
      </div>
    </div>

  </main>

  <!-- ==================== MODAL / BURBUJA DE DETALLE BLADE ==================== -->
  <div id="blade-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm hidden p-4">
    <div class="glass-nav rounded-xl p-5 max-w-lg w-full border border-slate-700 shadow-2xl relative space-y-4">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-xmark text-base"></i>
      </button>

      <div class="flex items-center gap-3 pb-3 border-b border-slate-800">
        <div class="w-8 h-8 rounded-lg bg-blue-600/20 flex items-center justify-center text-blue-400 border border-blue-500/30">
          <i class="fa-solid fa-microchip"></i>
        </div>
        <div>
          <h3 id="modal-title" class="text-sm font-bold text-white font-mono">ID Hardware</h3>
          <span id="modal-hostname" class="text-xs text-blue-400 font-mono">hostname</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 text-xs font-mono">
        <div class="bg-slate-900/80 p-2.5 rounded border border-slate-800">
          <span class="text-slate-500 block text-[10px]">DIRECCIÓN IP</span>
          <span id="modal-ip" class="text-emerald-400 font-bold">-</span>
        </div>
        <div class="bg-slate-900/80 p-2.5 rounded border border-slate-800">
          <span class="text-slate-500 block text-[10px]">DIRECCIÓN MAC</span>
          <span id="modal-mac" class="text-slate-300">-</span>
        </div>
        <div class="bg-slate-900/80 p-2.5 rounded border border-slate-800">
          <span class="text-slate-500 block text-[10px]">UBICACIÓN</span>
          <span id="modal-ubicacion" class="text-slate-300">-</span>
        </div>
        <div class="bg-slate-900/80 p-2.5 rounded border border-slate-800">
          <span class="text-slate-500 block text-[10px]">CONEXIÓN</span>
          <span id="modal-conexion" class="text-slate-300">-</span>
        </div>
      </div>

      <div id="modal-extra-section" class="space-y-2 text-xs font-mono">
        <!-- Contenido dinámico para puertos, docker, servicios, software y comentarios -->
      </div>

      <div class="flex justify-end pt-2">
        <button onclick="closeModal()" class="px-4 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 transition text-xs font-medium">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Script con la lógica de la Sala 3D -->
  <script type="module" src="../assets/js/representacion_3d.js"></script>
</body>
</html>
