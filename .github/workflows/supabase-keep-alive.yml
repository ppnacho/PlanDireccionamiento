name: Supabase Keep Alive

on:
  # Se ejecuta 4 veces al día (cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC)
  schedule:
    - cron: '0 */6 * * *'
  # Permite ejecutar manualmente la tarea desde la pestaña Actions en GitHub
  workflow_dispatch:

jobs:
  db-query:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta SELECT a la base de datos de Supabase
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/dispositivos_red?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
